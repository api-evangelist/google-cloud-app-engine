        idempotent: true
      call: google-cloud-app-engine.listversions
      with:
        appsId: tools.appsId
        servicesId: tools.servicesId
      inputParameters:
      - name: appsId
        type: string
        description: appsId
        required: true
      - name: servicesId
        type: string
        description: servicesId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: createversion
      description: Google Cloud App Engine Create Version
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: google-cloud-app-engine.createversion
      with:
        appsId: tools.appsId
        servicesId: tools.servicesId
