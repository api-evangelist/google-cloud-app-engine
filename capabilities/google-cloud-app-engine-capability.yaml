        idempotent: true
      call: google-cloud-app-engine.listservices
      with:
        appsId: tools.appsId
      inputParameters:
      - name: appsId
        type: string
        description: appsId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: getservice
      description: Google Cloud App Engine Get Service
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-app-engine.getservice
      with:
        appsId: tools.appsId
        servicesId: tools.servicesId
      inputParameters:
      - name: appsId
        type: string
        description: appsId
        required: true
      - name: servicesId
        type: string
        description: servicesId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: deleteservice
      description: Google Cloud App Engine Delete Service
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: google-cloud-app-engine.deleteservice
      with:
        appsId: tools.appsId
        servicesId: tools.servicesId
      inputParameters:
      - name: appsId
        type: string
        description: appsId
        required: true
      - name: servicesId
        type: string
        description: servicesId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listversions
      description: Google Cloud App Engine List Versions
      hints:
        readOnly: true
