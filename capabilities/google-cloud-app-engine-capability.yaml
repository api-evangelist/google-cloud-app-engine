naftiko: 1.0.0-alpha2
info:
  label: Google Cloud App Engine Admin API
  description: Provisions and manages developer App Engine applications, including deploying versions, managing traffic, and
    configuring services.
  tags:
  - Google
  - Cloud
  - App
  - Engine
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-cloud-app-engine
    baseUri: https://appengine.googleapis.com/v1
    description: Google Cloud App Engine Admin API HTTP API.
    authentication:
      type: bearer
      token: '{{GOOGLE_CLOUD_APP_ENGINE_TOKEN}}'
    resources:
    - name: apps-appsid
      path: /apps/{appsId}
      operations:
      - name: getapplication
        method: GET
        description: Google Cloud App Engine Get Application
        inputParameters:
        - name: appsId
          in: path
          type: string
          required: true
          description: The application ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateapplication
        method: PATCH
        description: Google Cloud App Engine Update Application
        inputParameters:
        - name: appsId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: apps-appsid-services
      path: /apps/{appsId}/services
      operations:
      - name: listservices
        method: GET
        description: Google Cloud App Engine List Services
        inputParameters:
        - name: appsId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: apps-appsid-services-servicesid
      path: /apps/{appsId}/services/{servicesId}
      operations:
      - name: getservice
        method: GET
        description: Google Cloud App Engine Get Service
        inputParameters:
        - name: appsId
          in: path
          type: string
          required: true
        - name: servicesId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteservice
        method: DELETE
        description: Google Cloud App Engine Delete Service
        inputParameters:
        - name: appsId
          in: path
          type: string
          required: true
        - name: servicesId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: apps-appsid-services-servicesid-versions
      path: /apps/{appsId}/services/{servicesId}/versions
      operations:
      - name: listversions
        method: GET
        description: Google Cloud App Engine List Versions
        inputParameters:
        - name: appsId
          in: path
          type: string
          required: true
        - name: servicesId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createversion
        method: POST
        description: Google Cloud App Engine Create Version
        inputParameters:
        - name: appsId
          in: path
          type: string
          required: true
        - name: servicesId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: apps-appsid-services-servicesid-versions-version
      path: /apps/{appsId}/services/{servicesId}/versions/{versionsId}/instances
      operations:
      - name: listinstances
        method: GET
        description: Google Cloud App Engine List Instances
        inputParameters:
        - name: appsId
          in: path
          type: string
          required: true
        - name: servicesId
          in: path
          type: string
          required: true
        - name: versionsId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: google-cloud-app-engine-rest
    description: REST adapter for Google Cloud App Engine Admin API.
    resources:
    - path: /apps/{appsId}
      name: getapplication
      operations:
      - method: GET
        name: getapplication
        description: Google Cloud App Engine Get Application
        call: google-cloud-app-engine.getapplication
        with:
          appsId: rest.appsId
        outputParameters:
        - type: object
          mapping: $.
    - path: /apps/{appsId}
      name: updateapplication
      operations:
      - method: PATCH
        name: updateapplication
        description: Google Cloud App Engine Update Application
        call: google-cloud-app-engine.updateapplication
        with:
          appsId: rest.appsId
        outputParameters:
        - type: object
          mapping: $.
    - path: /apps/{appsId}/services
      name: listservices
      operations:
      - method: GET
        name: listservices
        description: Google Cloud App Engine List Services
        call: google-cloud-app-engine.listservices
        with:
          appsId: rest.appsId
        outputParameters:
        - type: object
          mapping: $.
    - path: /apps/{appsId}/services/{servicesId}
      name: getservice
      operations:
      - method: GET
        name: getservice
        description: Google Cloud App Engine Get Service
        call: google-cloud-app-engine.getservice
        with:
          appsId: rest.appsId
          servicesId: rest.servicesId
        outputParameters:
        - type: object
          mapping: $.
    - path: /apps/{appsId}/services/{servicesId}
      name: deleteservice
      operations:
      - method: DELETE
        name: deleteservice
        description: Google Cloud App Engine Delete Service
        call: google-cloud-app-engine.deleteservice
        with:
          appsId: rest.appsId
          servicesId: rest.servicesId
        outputParameters:
        - type: object
          mapping: $.
    - path: /apps/{appsId}/services/{servicesId}/versions
      name: listversions
      operations:
      - method: GET
        name: listversions
        description: Google Cloud App Engine List Versions
        call: google-cloud-app-engine.listversions
        with:
          appsId: rest.appsId
          servicesId: rest.servicesId
        outputParameters:
        - type: object
          mapping: $.
    - path: /apps/{appsId}/services/{servicesId}/versions
      name: createversion
      operations:
      - method: POST
        name: createversion
        description: Google Cloud App Engine Create Version
        call: google-cloud-app-engine.createversion
        with:
          appsId: rest.appsId
          servicesId: rest.servicesId
        outputParameters:
        - type: object
          mapping: $.
    - path: /apps/{appsId}/services/{servicesId}/versions/{versionsId}/instances
      name: listinstances
      operations:
      - method: GET
        name: listinstances
        description: Google Cloud App Engine List Instances
        call: google-cloud-app-engine.listinstances
        with:
          appsId: rest.appsId
          servicesId: rest.servicesId
          versionsId: rest.versionsId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: google-cloud-app-engine-mcp
    transport: http
    description: MCP adapter for Google Cloud App Engine Admin API for AI agent use.
    tools:
    - name: getapplication
      description: Google Cloud App Engine Get Application
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-cloud-app-engine.getapplication
      with:
        appsId: tools.appsId
      inputParameters:
      - name: appsId
        type: string
        description: The application ID.
        required: true
      outputParameters:
      - type: object
        mapping: $.
